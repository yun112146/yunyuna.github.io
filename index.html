<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR設計 - 擴增實境創新體驗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', 'Microsoft JhengHei', sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 100px 20px;
            text-align: center;
        }
        
        header h1 {
            font-size: 3em;
            margin-bottom: 20px;
            animation: fadeInDown 1s;
        }
        
        header p {
            font-size: 1.3em;
            opacity: 0.95;
            animation: fadeInUp 1s;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 80px 20px;
        }
        
        .feature-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        
        .feature-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        .feature-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .cta-section {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }
        
        .cta-section h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        .cta-button {
            display: inline-block;
            background: white;
            color: #f5576c;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        footer {
            background: #2d3748;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>AR設計</h1>
        <p>將想像帶入現實，創造沉浸式擴增實境體驗</p>
    </header>
    
    <div class="container">
        <section class="features">
            <div class="feature-card">
                <div class="feature-icon">🎯</div>
                <h3>精準定位</h3>
                <p>運用先進的空間定位技術，讓虛擬物件完美融入真實環境，提供流暢自然的互動體驗。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">✨</div>
                <h3>創意設計</h3>
                <p>專業團隊打造獨特的AR內容，從產品展示到互動遊戲，為您的品牌創造驚艷視覺效果。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">📱</div>
                <h3>跨平台支援</h3>
                <p>支援iOS、Android等多種平台，讓更多用戶都能體驗您的AR應用，擴大影響力。</p>
            </div>
        </section>
    </div>
    
    <section class="cta-section">
        <h2>準備好開始您的AR之旅了嗎？</h2>
        <p>讓我們一起打造令人驚艷的擴增實境體驗</p>
        <a href="#contact" class="cta-button">立即聯繫</a>
    </section>
    
    <footer>
        <p>&copy; 2024 AR設計. 版權所有</p>
    </footer>
</body>
</html>
